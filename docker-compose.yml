version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: log-postgres
    environment:
      POSTGRES_USER: loguserjio
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logsdbjio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: log-backend
    ports:
      - "6001:6001"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logsdbjio
      DB_USER: loguserjio
      DB_PASSWORD: password

  frontend:
    build: ./frontend
    container_name: log-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: